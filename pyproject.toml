[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jochen-x"
version = "0.7.0"
description = "JOCHEN X desktop framework"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
