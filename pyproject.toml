[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jochen-x"
version = "0.9.0"
description = "JOCHEN X desktop framework"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8"
]

[tool.setuptools]
packages = ["app", "core", "sdk", "plugins", "services", "developer",
            "ui", "config", "database", "styles", "ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "ui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.ruff]
src = ["."]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "S", "ASYNC", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "BLE001", "PLR2004"]
